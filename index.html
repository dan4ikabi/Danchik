<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Қалта</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: left rail on desktop, bottom tab bar + floating add button on phone; paper ground, ink hero, bank colours for identity, indigo for actions */
  --bg:#F2F3F7; --surface:#FFFFFF; --surface-2:#F6F7FA; --line:#E2E4EC;
  --ink:#141726; --ink-2:#474C63; --ink-3:#878CA3;
  --accent:#4B45C6; --accent-soft:#ECEBFB; --accent-ink:#FFFFFF;
  --pos:#12805A; --pos-soft:#E1F3EA; --warn:#B26400; --warn-soft:#FFF0D8; --crit:#C23934; --crit-soft:#FCE6E4;
  --kaspi:#E0453A; --freedom:#12A150; --halyk:#CF9B00; --cash:#6E7891;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Onest","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:16px; --shadow:0 1px 2px rgba(20,24,41,.05),0 8px 26px -14px rgba(20,24,41,.16);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D0F17; --surface:#151824; --surface-2:#1B1F2E; --line:#262A3B; --ink:#ECEEF6; --ink-2:#B0B4C8; --ink-3:#747991;
  --accent:#8F8AF5; --accent-soft:#25244A; --accent-ink:#0D0F17; --pos:#45C58C; --pos-soft:#13301F; --warn:#F0A63A; --warn-soft:#33260F; --crit:#F0716A; --crit-soft:#3A1917;
  --kaspi:#F2625A; --freedom:#2DC26C; --halyk:#E6B425; --cash:#97A0B8; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px -14px rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0D0F17; --surface:#151824; --surface-2:#1B1F2E; --line:#262A3B; --ink:#ECEEF6; --ink-2:#B0B4C8; --ink-3:#747991;
  --accent:#8F8AF5; --accent-soft:#25244A; --accent-ink:#0D0F17; --pos:#45C58C; --pos-soft:#13301F; --warn:#F0A63A; --warn-soft:#33260F; --crit:#F0716A; --crit-soft:#3A1917;
  --kaspi:#F2625A; --freedom:#2DC26C; --halyk:#E6B425; --cash:#97A0B8; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px -14px rgba(0,0,0,.6); color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100%}
.rail{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:20px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--ink);display:grid;place-items:center;flex:none}
.brand-mark span{display:block;width:16px;height:12px;border:2.5px solid var(--bg);border-top-width:5px;border-radius:3px}
.brand b{font-family:var(--display);font-size:19px;letter-spacing:-.01em}
.brand small{display:block;color:var(--ink-3);font-size:11.5px;margin-top:1px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;color:var(--ink-2);text-decoration:none;font-weight:500}
.nav a svg,.mnav a svg,.ico{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .badge{margin-left:auto}
.rail-foot{margin-top:auto;font-size:12px;color:var(--ink-3);padding:0 8px;display:flex;flex-direction:column;gap:10px}
.ghost{display:inline-flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);padding:8px 12px;border-radius:10px;font-size:13.5px;color:var(--ink-2);font-weight:500}
.ghost:hover{border-color:var(--ink-3);color:var(--ink)}
main{min-width:0;padding:22px clamp(16px,3vw,36px) 60px;max-width:1240px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.top h1{font-family:var(--display);font-weight:600;font-size:clamp(21px,2.6vw,27px);letter-spacing:-.015em}
.top p{margin:4px 0 0;color:var(--ink-3);font-size:13.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14.5px}
.btn:hover{filter:brightness(1.07)}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.sec:hover{border-color:var(--ink-3)}
.btn.danger{background:var(--crit-soft);color:var(--crit)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn .ico{width:17px;height:17px}
.view{display:none;flex-direction:column;gap:16px}
.view.on{display:flex}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g21{grid-template-columns:1.55fr 1fr}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:15.5px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.card h2 small{font-weight:500;color:var(--ink-3);font-size:12.5px}
a.card,button.card{text-align:left;color:inherit;text-decoration:none;display:block;width:100%}
a.card:hover,button.card:hover{border-color:var(--ink-3)}
.label{font-size:12.5px;color:var(--ink-3);font-weight:500}
.big{font-family:var(--display);font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)} .pos{color:var(--pos)} .crit{color:var(--crit)} .warnc{color:var(--warn)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.p-pos{background:var(--pos-soft);color:var(--pos)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-crit{background:var(--crit-soft);color:var(--crit)}.p-acc{background:var(--accent-soft);color:var(--accent)}.p-mute{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block;flex:none}
.bb{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:700;font-family:var(--display);font-size:14px;flex:none}
.bb.s{width:28px;height:28px;font-size:11px;border-radius:8px}
/* hero */
.hero{background:var(--ink);color:var(--bg);border:0;position:relative;overflow:hidden;padding:22px 24px}
.hero .label{color:color-mix(in srgb,var(--bg) 62%,transparent)}
.hero .big{font-size:clamp(32px,5vw,48px);margin:6px 0 2px;line-height:1.1}
.hero .sub{font-size:13.5px;color:color-mix(in srgb,var(--bg) 72%,transparent);max-width:60ch}
.hero-dots{position:absolute;inset:0;opacity:.07;background-image:radial-gradient(currentColor 1px,transparent 1px);background-size:14px 14px;pointer-events:none}
.eq{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:16px;font-size:13px}
.eq span.t{padding:6px 10px;border-radius:10px;background:color-mix(in srgb,var(--bg) 10%,transparent);display:flex;flex-direction:column;line-height:1.25}
.eq span.t b{font-size:15px;font-variant-numeric:tabular-nums}
.eq span.op{opacity:.6;font-weight:700}
.hero.neg .big{color:#FF9C95}
/* accounts strip */
.accts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.acct{text-decoration:none;display:flex;align-items:center;gap:11px;padding:13px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);min-width:0;text-align:left;color:inherit}
.acct b{display:block;font-size:15.5px;font-variant-numeric:tabular-nums}
.acct small{color:var(--ink-3);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct>div{min-width:0}
/* rows */
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%;color:inherit}
.row:last-child{border-bottom:0}
button.row:hover{background:var(--surface-2)}
.row .t1{font-weight:500;overflow-wrap:anywhere}
.row .t2{font-size:12.5px;color:var(--ink-3);display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}
.row .amt{font-weight:600;text-align:right;white-space:nowrap}
.row .amt small{display:block;font-weight:500;color:var(--ink-3);font-size:11.5px}
.daysep{font-size:12px;font-weight:600;color:var(--ink-3);padding:14px 4px 4px;text-transform:uppercase;letter-spacing:.04em}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:1px 7px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);font-weight:500}
.tag.acc{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.tag.pos{background:var(--pos-soft);border-color:transparent;color:var(--pos)}
.tag.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
/* progress */
.prog{height:10px;border-radius:6px;background:var(--surface-2);overflow:hidden;display:flex}
.prog i{display:block;height:100%}
.kpi .big{font-size:22px;margin-top:6px}
.kpi .foot{margin-top:8px;font-size:12.5px;color:var(--ink-3);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
/* controls */
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{flex:1 1 220px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search input{border:0;background:none;outline:none;padding:10px 0;width:100%}
.select,.input{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px;min-width:0}
.input:focus,.select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 11px;border-radius:9px;font-size:13px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:20px;font-size:13px;font-weight:500;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.empty{padding:28px 12px;text-align:center;color:var(--ink-3)}
.empty b{display:block;color:var(--ink-2);margin-bottom:4px}
.note{font-size:12.5px;color:var(--ink-3);margin:10px 0 0}
/* charts */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--ink-3);font-size:11px;font-family:var(--body)}
.chart .gl{stroke:var(--line);stroke-width:1}
.hbars{display:flex;flex-direction:column;gap:11px}
.hbar{display:grid;grid-template-columns:minmax(100px,170px) 1fr auto;gap:12px;align-items:center;font-size:13.5px}
.hbar .track{height:9px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.hbar .fill{height:100%;border-radius:6px}
.hbar .v{font-weight:600;text-align:right;min-width:88px}
.hbar .v small{display:block;color:var(--ink-3);font-weight:500;font-size:11.5px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:14px;height:14px;border-radius:3px;display:block}
/* aylyq grid */
.ag-wrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
table.ag{border-collapse:separate;border-spacing:0;font-size:13.5px;min-width:100%}
.ag th,.ag td{padding:6px 6px;text-align:center;white-space:nowrap}
.ag th{font-size:11.5px;color:var(--ink-3);font-weight:600;position:sticky;top:0;background:var(--surface)}
.ag td.nm,.ag th.nm{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1;font-weight:500;padding-right:12px}
.ag td.nm small{display:block;color:var(--ink-3);font-weight:500;font-size:11.5px}
.cell{width:42px;height:36px;border-radius:10px;border:1.5px dashed var(--line);background:none;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink-3)}
.cell.full{background:var(--pos-soft);border:0;color:var(--pos)}
.cell.part{background:var(--warn-soft);border:0;color:var(--warn)}
.cell.miss{background:var(--crit-soft);border:0;color:var(--crit)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,20,.45);z-index:40;display:none;align-items:flex-end;justify-content:center}
.scrim.on{display:flex}
@media (min-width:861px){.scrim{align-items:center}}
.sheet{background:var(--surface);width:min(560px,100%);max-height:min(88vh,860px);overflow:auto;border-radius:22px 22px 0 0;padding:8px 20px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.25)}
@media (min-width:861px){.sheet{border-radius:22px;padding:8px 24px 24px}}
.grab{width:42px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 10px}
.sheet h3{font-family:var(--display);font-weight:600;font-size:19px;margin-bottom:4px}
.sheet .sub{color:var(--ink-3);font-size:13.5px;margin-bottom:16px}
.sheet .acts{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.sheet .acts .btn{flex:1 1 140px}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:left;margin-bottom:8px}
.opt:hover{border-color:var(--accent)}
.opt .oi{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.opt b{display:block;font-weight:600}
.opt small{color:var(--ink-3);font-size:12.5px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:14px;font-weight:500;z-index:60;box-shadow:var(--shadow);display:none;max-width:90vw}
.toast.on{display:flex;align-items:center;gap:14px}
.toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;padding:0}
.xbtn{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--crit);font-size:17px;line-height:1;flex:none;display:inline-grid;place-items:center;padding:0}
.xbtn:hover{border-color:var(--crit);background:var(--crit-soft)}
.paidl{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:18px;background:var(--accent);color:var(--accent-ink);border:0;display:none;place-items:center;box-shadow:0 10px 26px -8px color-mix(in srgb,var(--accent) 70%,transparent);z-index:20}
.fab svg{width:26px;height:26px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round}
.mnav{display:none}
.drop{border:2px dashed var(--line);border-radius:18px;padding:28px 18px;text-align:center;background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:10px}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .big{font-size:18px}
.sync{font-size:12px;display:flex;align-items:center;gap:6px;color:var(--ink-3)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.sync.ok i{background:var(--pos)} .sync.local i{background:var(--warn)}
.ring{--p:0;width:54px;height:54px;border-radius:50%;background:conic-gradient(var(--c,var(--pos)) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center;flex:none}
.ring::after{content:attr(data-l);width:42px;height:42px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:12px;font-weight:700}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g21{grid-template-columns:1fr}.accts{grid-template-columns:repeat(2,1fr)}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}.rail{display:none}
  main{padding:16px 14px calc(150px + env(safe-area-inset-bottom))}
  .mnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);justify-content:space-around;padding:6px 2px calc(6px + env(safe-area-inset-bottom))}
  .mnav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--ink-3);text-decoration:none;padding:4px 4px;border-radius:8px;min-width:58px;position:relative}
  .mnav a[aria-current="page"]{color:var(--accent);font-weight:600}
  .mnav a .nb{position:absolute;top:0;right:10px;width:8px;height:8px;border-radius:50%;background:var(--crit)}
  .fab{display:grid}
  .g2,.g3{grid-template-columns:1fr}
  .top .hide-m{display:none}
  :root{--shadow:none}
  input,select,textarea,.input,.select{font-size:16px!important}
  .top{margin-bottom:12px}.top h1{font-size:22px}.top p{display:none}
  .row{padding:13px 2px;min-height:58px}
  .card{border-radius:14px}
  .sheet{max-height:92vh;padding-bottom:0}
  .sheet .acts{position:sticky;bottom:0;background:var(--surface);margin:18px -20px 0;padding:12px 20px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
  .hero{padding:18px}.hero .big{font-size:34px}.eq{gap:6px}.eq span.t{padding:5px 8px}
  .seg button{padding:8px 12px;font-size:14px}
  .btn{padding:12px 16px}
  .fab{bottom:calc(74px + env(safe-area-inset-bottom));transition:transform .2s}
  .fab.hide{transform:translateY(140px)}
  .eq{display:grid;grid-template-columns:1fr 1fr}.eq span.op{display:none}
  .kpi{padding:14px 16px}.kpi .big{font-size:20px}
  .ks{grid-template-columns:repeat(3,1fr)!important;gap:8px}.ks .card{padding:12px 10px}.ks .big{font-size:15px!important;margin-top:4px}.ks .label{font-size:11.5px}.ks .foot{font-size:11px;margin-top:6px}
  #v-tx>.card{background:none;border:0;padding:0}
}
@media (max-width:520px){.g4{grid-template-columns:1fr 1fr}.kpi .big{font-size:18px}.hbar{grid-template-columns:92px 1fr auto}.fgrid{grid-template-columns:1fr}.card{padding:16px}.accts{gap:8px}.acct{padding:11px}.acct .bb{width:30px;height:30px;font-size:12px}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .16s ease-out}@keyframes up{from{transform:translateY(24px)}to{transform:none}}}
button,a,.chip,.cell{touch-action:manipulation}
.sheet{overscroll-behavior:contain}
.mrow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.tog{min-width:118px;height:44px;border-radius:12px;border:1.5px dashed var(--line);background:none;font-weight:600;font-size:14px;color:var(--ink-3)}
.tog.full{background:var(--pos-soft);border:0;color:var(--pos)}.tog.part{background:var(--warn-soft);border:0;color:var(--warn)}.tog.miss{border-color:var(--crit);color:var(--crit)}

<script>
/* Qalta statement parsers: input = pages [[{x,y,s}]] from pdf.js getTextContent; output = {bank, meta, rows} */
(function (root) {
  const num = (s) => { // "1 234,56" | "1,234.56" | "+ 97 000,00 ₸"
    s = String(s).replace(/[₸$€\s  ]/g, '');
    let sign = 1; if (s[0] === '-' || s[0] === '−') { sign = -1; s = s.slice(1); } else if (s[0] === '+') s = s.slice(1);
    if (/,\d\d$/.test(s)) s = s.replace(/\./g, '').replace(',', '.'); else s = s.replace(/,/g, '');
    return sign * parseFloat(s);
  };
  const iso = (d) => { const p = d.split('.'); let y = p[2]; if (y.length === 2) y = '20' + y; return `${y}-${p[1]}-${p[0]}`; };
  function lines(items, tol = 2) { // group by y
    const sorted = items.slice().sort((a, b) => b.y - a.y || a.x - b.x); const out = [];
    for (const it of sorted) { const l = out.find((L) => Math.abs(L.y - it.y) <= tol); if (l) l.items.push(it); else out.push({ y: it.y, items: [it] }); }
    out.forEach((l) => l.items.sort((a, b) => a.x - b.x)); out.sort((a, b) => b.y - a.y); return out;
  }
  const lineText = (l) => l.items.map((i) => i.s).join(' ');
  function detect(pages) {
    const t = pages.slice(0, 2).flat().map((i) => i.s).join(' ');
    if (/CASPKZKA|Kaspi Gold|Kaspi Bank/i.test(t) && !/KSNVKZKA|HSBKKZKX/.test(t)) return 'K';
    if (/KSNVKZKA|Фридом|Freedom Bank|bankffin/i.test(t)) return 'F';
    if (/HSBKKZKX|Народный Банк|Halyk/i.test(t)) return 'H';
    if (/CASPKZKA/.test(t)) return 'K';
    return null;
  }

  /* ---------------- Kaspi ---------------- */
  function parseKaspi(pages) {
    const all = pages.flat(); const text = pages.map((p) => lines(p).map(lineText).join('\n')).join('\n');
    const meta = {};
    let m = text.match(/(\d\d\.\d\d\.\d\d)ж?\.?\s*(?:бастап|по)?\s*(\d\d\.\d\d\.\d\d)ж?\.?\s*(?:дейінгі|кезең)/) || text.match(/с\s+(\d\d\.\d\d\.\d\d)\s*(?:г\.)?\s*по\s+(\d\d\.\d\d\.\d\d)/);
    if (m) { meta.from = iso(m[1]); meta.to = iso(m[2]); }
    const avail = [...text.matchAll(/(\d\d\.\d\d\.\d\d)ж?\.?\s*(?:қолжетімді|[Дд]оступно)[^\n+\-]*?([+-]\s?[\d\s]+,\d\d)/g)];
    for (const a of avail) { const d = iso(a[1]); if (meta.from && d === meta.from && meta.open == null) meta.open = num(a[2]); if (meta.to && d === meta.to) meta.close = num(a[2]); }
    const card = text.match(/(?:Карта нөмірі|Номер карты):?\s*(\*\d{4})/); if (card) meta.card = 'Карта ' + card[1];
    const rows = []; let opX = 240, detX = 305;
    for (const page of pages) {
      const L = lines(page);
      for (const l of L) {
        const hOp = l.items.find((i) => /^Операция$/.test(i.s)); const hDet = l.items.find((i) => /^(Толығырақ|Детали)$/.test(i.s));
        if (hOp && hDet) { opX = hOp.x - 22; detX = hDet.x - 6; continue; }
        const f = l.items[0]; const amt = l.items.find((i) => /^[+-]\s?[\d\s ]+,\d\d\s?₸?$/.test(i.s.trim()));
        if (f && /^\d\d\.\d\d\.\d\d$/.test(f.s.trim()) && f.x < 120 && amt) {
          const op = l.items.filter((i) => i.x >= opX && i.x < detX).map((i) => i.s).join(' ').trim();
          const det = l.items.filter((i) => i.x >= detX).map((i) => i.s).join(' ').trim();
          rows.push({ d: iso(f.s.trim()), a: num(amt.s), ccy: 'KZT', op, det, _y: l.y });
        } else if (rows.length && l.items.every((i) => i.x >= detX) && rows[rows.length - 1]._y - l.y < 14 && rows[rows.length - 1]._y > l.y) {
          rows[rows.length - 1].det += ' ' + lineText(l); rows[rows.length - 1]._y = l.y;
        }
      }
    }
    rows.forEach((r) => delete r._y);
    return { bank: 'K', meta, rows };
  }

  /* ---------------- Freedom ---------------- */
  function parseFreedom(pages) {
    const text = pages.map((p) => lines(p).map(lineText).join('\n')).join('\n'); const meta = {};
    let m = text.match(/(\d\d\.\d\d\.\d{4})\s*-\s*(\d\d\.\d\d\.\d{4})/); if (m) { meta.from = iso(m[1]); meta.to = iso(m[2]); }
    m = text.match(/KZ\w+KZT\s+KZT\s+([\d,]+\.\d\d)/); if (m) meta.close = num(m[1]);
    m = text.match(/(?:Сома қарастырылып жатыр|Сумма в обработке)\s+([\d,]+\.\d\d)/); if (m) meta.pending = num(m[1]);
    const card = text.match(/(?:Карта нөмірі|Номер карты):?\s*(\*+\d{4})/); if (card) meta.card = 'Карта ' + card[1];
    const rows = []; let col = null;
    for (const page of pages) {
      const hd = page.find((i) => /^(Күні|Дата)$/.test(i.s.trim())); let headY = Infinity;
      if (hd) {
        const same = page.filter((i) => Math.abs(i.y - hd.y) < 3);
        const g = (re) => (same.find((i) => re.test(i.s.trim())) || {}).x;
        const c = { sum: g(/^(Сома|Сумма)$/), ccy: g(/^Валюта$/), op: g(/^Операция$/), det: g(/^(Мәліметтер|Детали)$/) };
        if (c.sum && c.op && c.det) { col = c; headY = hd.y; }
      }
      if (!col) continue;
      const items = page.filter((i) => i.y < headY - 4 && i.y > 70 && i.s.trim());
      const anchors = items.filter((i) => /^\d\d\.\d\d\.\d{4}$/.test(i.s.trim()) && i.x < col.sum - 40).sort((a, b) => b.y - a.y);
      if (!anchors.length) continue;
      const groups = anchors.map((a) => ({ a, items: [] }));
      for (const it of items) { if (anchors.includes(it)) continue; let best = null, bd = 1e9; for (const g of groups) { const d = Math.abs(g.a.y - it.y); if (d < bd) { bd = d; best = g; } } if (best && bd < 30) best.items.push(it); }
      for (const g of groups) {
        const its = g.items.sort((a, b) => b.y - a.y || a.x - b.x);
        const amt = its.find((i) => /^[+-][\d,]+\.\d\d\s?[₸$€]$/.test(i.s.trim())); if (!amt) continue;
        const ccy = (its.find((i) => /^(KZT|USD|EUR)$/.test(i.s.trim())) || { s: 'KZT' }).s.trim();
        const cut = col.op + (col.det - col.op) * 0.4, opL = col.ccy + 25;
        const op = its.filter((i) => i.x >= opL && i.x < cut).map((i) => i.s.trim()).join(' ');
        const det = its.filter((i) => i.x >= cut).map((i) => i.s.trim()).join(' ');
        rows.push({ d: iso(g.a.s.trim()), a: num(amt.s), ccy, op: op.replace(/\s+/g, ' '), det: det.replace(/\s+/g, ' ') });
      }
    }
    return { bank: 'F', meta, rows };
  }

  /* ---------------- Halyk ---------------- */
  function parseHalyk(pages) {
    const text = pages.map((p) => lines(p).map(lineText).join('\n')).join('\n'); const meta = {};
    let m = text.match(/с\s+(\d\d\.\d\d\.\d{4})\s+по\s+(\d\d\.\d\d\.\d{4})/); if (m) { meta.from = iso(m[1]); meta.to = iso(m[2]); }
    m = text.match(/Входящий остаток:\s*([\d\s]+,\d\d)\s*KZT;\s*([\d\s]+,\d\d)\s*USD/); if (m) { meta.open = num(m[1]); meta.openUsd = num(m[2]); }
    m = text.match(/Исходящий остаток:\s*([\d\s]+,\d\d)\s*KZT;\s*([\d\s]+,\d\d)\s*USD/); if (m) { meta.close = num(m[1]); meta.closeUsd = num(m[2]); }
    const accK = (text.match(/Номер счета KZT:\s*(KZ\w+)/) || [])[1], accU = (text.match(/Номер счета USD:\s*(KZ\w+)/) || [])[1];
    m = text.match(/(\d{6}\*{6}\d{4})/); if (m) meta.card = 'Карта *' + m[1].slice(-4);
    const fio = text.match(/ФИО:\s*([^\n]+?)\s{2,}|ФИО:\s*(\S+\s\S+)/); if (fio) meta.name = (fio[1] || fio[2]).trim();
    const rows = []; let col = null;
    for (const page of pages) {
      const hd = page.find((i) => /^Описание операции$/.test(i.s.trim())); let headY = Infinity;
      if (hd) {
        const near = page.filter((i) => Math.abs(i.y - hd.y) < 8);
        const g = (re) => { const f = near.find((i) => re.test(i.s.trim())); return f ? f.x + f.w / 2 : null; };
        const c = { desc: hd.x + hd.w / 2, sum: g(/^Сумма$/), ccy: g(/^Валюта$/), inc: g(/^Приход в$/), exp: g(/^Расход в$/), com: g(/^Комиссия$/), acc: g(/^№ карточки/) };
        if (c.sum && c.inc && c.exp) { col = c; headY = Math.min(...page.filter((i) => Math.abs(i.y - hd.y) < 14).map((i) => i.y)); }
      }
      if (!col) continue;
      const bnd = (a, b) => (a + b) / 2;
      const B = { d1: bnd(col.desc, col.sum), d2: bnd(col.sum, col.ccy), d3: bnd(col.ccy, col.inc), d4: bnd(col.inc, col.exp), d5: bnd(col.exp, col.com), d6: bnd(col.com, col.acc) };
      const items = page.filter((i) => i.y < headY - 2 && i.y > 45 && i.s.trim());
      const anchors = items.filter((i) => /^\d\d\.\d\d\.\d{4}$/.test(i.s.trim()) && i.x < 60).sort((a, b) => b.y - a.y);
      anchors.forEach((a, k) => {
        const top = a.y + 3, bot = k + 1 < anchors.length ? anchors[k + 1].y + 3 : 45;
        const its = items.filter((i) => i.y <= top && i.y > bot && i !== a).sort((p, q) => q.y - p.y || p.x - q.x);
        const inCol = (lo, hi) => its.filter((i) => { const c = i.x + i.w / 2; return c >= lo && c < hi; });
        const desc = inCol(100, B.d1).map((i) => i.s.trim()).join(' ').replace(/\s+/g, ' ');
        const pick = (lo, hi) => { const f = inCol(lo, hi).find((i) => /^-?[\d\s]+,\d\d$/.test(i.s.trim())); return f ? num(f.s) : 0; };
        const amt = pick(B.d1, B.d2), inc = pick(B.d3, B.d4), exp = pick(B.d4, B.d5), com = pick(B.d5, B.d6);
        const ccyOp = (inCol(B.d2, B.d3)[0] || { s: 'KZT' }).s.trim();
        const accTxt = inCol(B.d6, 1e9).map((i) => i.s.trim()).join(' ');
        let acur = /\(USD\)/.test(accTxt) ? 'USD' : /\(KZT\)/.test(accTxt) ? 'KZT' : null;
        if (!acur && accU && accTxt.includes(accU)) acur = 'USD'; if (!acur && accK && accTxt.includes(accK)) acur = 'KZT';
        if (!acur) acur = ccyOp;
        rows.push({ d: iso(a.s.trim()), a: Math.round((inc + exp + com) * 100) / 100, ccy: acur, op: desc, det: desc, opAmt: amt, opCcy: ccyOp, com });
      });
    }
    return { bank: 'H', meta, rows };
  }

  function parseStatement(pages) {
    const b = detect(pages);
    if (b === 'K') return parseKaspi(pages); if (b === 'F') return parseFreedom(pages); if (b === 'H') return parseHalyk(pages);
    return null;
  }

function syncLinks(){let ch=false;const B=S.book;

  Object.entries(B.billPaid).forEach(([m,mm])=>Object.entries(mm).forEach(([bid,v])=>{const bl=B.bills.find(x=>x.id===bid);if(v&&v.via==='C'&&v.d>=st)E.push({d:v.d,a:-v.a,title:(bl?bl.name:'Төлем'),src:'Міндетті төлем',auto:true})}));

function billStatus(bl,m){const man=(S.book.billPaid[m]||{})[bl.id];let paid=0,via=null,d=null,auto=[];
  const dueD=parseInt(String(bl.day).split(/[–-]/)[0])||0;const ws=dueD&&dueD<=5?addDays(m+'-01',-4):m+'-01',we=dueD&&dueD<=5?addDays(addMonth(m,1)+'-01',-5):addDays(addMonth(m,1)+'-01',-1);
  if(bl.match){const re=new RegExp(bl.match.re,'i');auto=TX.filter(t=>t.b===bl.match.b&&t.d>=ws&&t.d<=we&&t.a<0&&re.test(t.raw.det||t.t)&&(!bl.match.amt||Math.abs(-t.a-bl.match.amt)/bl.match.amt<0.03));
    if(bl.match.amt&&auto.length>1){}paid+=sum(auto,t=>-t.a);if(auto[0]){d=auto[0].d;via=auto[0].b}}
  if(man){paid+=man.a;d=man.d;via=man.via}
  const day=parseInt(String(bl.day).split(/[–-]/).pop())||0;const t=todayISO();
  let st='wait';if(paid>=bl.amount*0.97)st='paid';else if(paid>0)st='part';else if(m<t.slice(0,7)||(m===t.slice(0,7)&&day&&+t.slice(8,10)>day))st='late';
  return{paid,st,d,via,auto,man}}

function claimEdit(id){const c=S.book.claims.find(x=>x.id===id);if(!c)return;const ppl=c.people.map(p=>({name:p.name,amount:p.amount,paid:p.paid}));

function heat(list){if(!list.length)return '';const ds=list.map(t=>t.d).sort();const start=new Date(ds[0]),end=new Date(ds[ds.length-1]);const by={};list.forEach(t=>by[t.d]=(by[t.d]||0)-t.a);const max=Math.max(...Object.values(by),1);
  const s=new Date(start);s.setDate(s.getDate()-((s.getDay()+6)%7));const col=v=>!v?'var(--surface-2)':`color-mix(in srgb,var(--accent) ${Math.round(18+82*Math.min(1,v/max))}%,var(--surface-2))`;let c='';
  for(const d=new Date(s);d<=end;d.setDate(d.getDate()+1)){const k=d.toISOString().slice(0,10);c+=`<i style="background:${d<start?'transparent':col(by[k])}" title="${dfmt(k)}: ${fmt(by[k]||0,false)}"></i>`}
  return `<div class="heat">${c}</div><p class="note">Ең көп күн: ${fmt(max,false)}</p>`}

let pdfReady=null;
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('script '+src));document.head.appendChild(s)})}
function ensurePdf(){if(!pdfReady)pdfReady=(async()=>{const base='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';await loadScript(base+'pdf.worker.min.js');await loadScript(base+'pdf.min.js');window.pdfjsLib.GlobalWorkerOptions.workerSrc=base+'pdf.worker.min.js';return window.pdfjsLib})();return pdfReady}
async function pdfPages(file){const lib=await ensurePdf();const buf=new Uint8Array(await file.arrayBuffer());const doc=await lib.getDocument({data:buf,isEvalSupported:false}).promise;const out=[];
  for(let i=1;i<=doc.numPages;i++){const tc=await (await doc.getPage(i)).getTextContent();out.push(tc.items.filter(t=>t.str&&t.str.trim()).map(t=>({x:t.transform[4],y:t.transform[5],w:t.width,s:t.str})))}return out}
async function handleFiles(files){files=files.filter(f=>/pdf$/i.test(f.name)||f.type==='application/pdf');if(!files.length){toast('PDF файл таңдаңыз');return}
  location.hash='#upload';UPLOG=files.map(f=>({title:f.name,sub:'Оқылуда…',warn:true}));render();const touched=[];
  for(let i=0;i<files.length;i++){const f=files[i];try{
      const pages=await pdfPages(f);const r=QaltaParser.parseStatement(pages);
      if(!r||!r.rows.length){UPLOG[i]={title:f.name,sub:'Банк үзіндісі танылмады. Kaspi, Freedom немесе Halyk үзіндісін PDF етіп жүктеңіз.',ok:false};render();continue}
      if(!r.meta.from||!r.meta.to){const ds=r.rows.map(x=>x.d).sort();r.meta.from=r.meta.from||ds[0];r.meta.to=r.meta.to||ds[ds.length-1]}
      const old=S.banks[r.bank];let replaced=0,kept=[];const rd=r.rows.map(x=>x.d).sort(),lo=rd[0]<r.meta.from?rd[0]:r.meta.from,hi=rd[rd.length-1]>r.meta.to?rd[rd.length-1]:r.meta.to;if(old){kept=old.rows.filter(x=>x.d<lo||x.d>hi);replaced=old.rows.length-kept.length}
      const rows=kept.concat(r.rows).sort((a,b)=>a.d.localeCompare(b.d));const meta=(!old||r.meta.to>=old.meta.to)?{...r.meta,from:old&&old.meta.from<r.meta.from?old.meta.from:r.meta.from}:{...old.meta,from:old.meta.from<r.meta.from?old.meta.from:r.meta.from};
      S.banks[r.bank]={meta,rows};touched.push(r.bank);
      let check='';if(r.meta.open!=null&&r.meta.close!=null&&r.bank!=='F'){const net=r.rows.filter(x=>x.ccy==='KZT').reduce((s,x)=>s+x.a,0);check=Math.abs(r.meta.open+net-r.meta.close)<1?' · қалдық банк сомасымен сәйкес ✓':' · қалдықты тексеріңіз'}
      UPLOG[i]={b:r.bank,title:`${BANKS[r.bank].name}: ${dfmt(r.meta.from)} – ${dfmt(r.meta.to)}`,sub:`${r.rows.length} операция оқылды${replaced?', '+replaced+' ескі операция ауыстырылды':''}${check}`,ok:!/тексеріңіз/.test(check)};
    }catch(e){console.error(e);UPLOG[i]={title:f.name,sub:/script/.test(e.message)?'PDF оқитын модуль жүктелмеді. Интернетті тексеріп, қайта көріңіз.':'Файлды оқу мүмкін болмады.',ok:false}}
    rebuild();render()}
  lsSet();if(DB&&touched.length){setSync('local','Сақталуда…');saving=saving.then(()=>pushBanks(touched)).then(()=>setSync('ok','Аккаунтта сақталған')).catch(e=>{console.warn(e);setSync('local','Сақталмады')})}
  if(touched.length)toast('Үзінділер жүктелді')}

function personName(t){if(t.c!=='Адамдарға'&&t.c!=='Адамдардан')return null;let s=String(t.t||'').trim();

function txRow(t){const L=LINK[t.id];const lab=rowLabel(t);const tg=[];if(t.pending)tg.push('<span class="tag warn">Расталмаған</span>');if(L)tg.push(`<span class="tag acc">${esc(L.label)}</span>`);
  return `<button class="row" type="button" data-tx="${esc(t.id)}">${av(lab)}<div class="mid"><div class="t1">${esc(t.pn||t.t||t.c)}</div><div class="t2"><i class="bdot" style="background:${BANKS[t.b].color}"></i>${esc(lab)} · ${dshort(t.d)}${tg.join('')}</div></div><div class="amt num ${t.a>0?'pos':''}">${fmt(t.a,true)}</div></button>`}
function txChunk(list,from,to,group,lastRef){let h='';for(let i=from;i<Math.min(to,list.length);i++){const t=list[i];if(group&&t.d!==lastRef.d){h+=`<div class="daysep">${dfmt(t.d)}</div>`;lastRef.d=t.d}h+=txRow(t)}return h}
const IO_LIST=new WeakMap();
function mountList(el,list,group){if(!el)return;if(!list.length){el.innerHTML='<div class="empty"><b>Операция жоқ</b>Сүзгіні өзгертіп көріңіз</div>';return}
  let io=null;const st={n:0,last:{d:''}};const step=50;el.innerHTML='<div class="list"></div><div class="sentinel"></div>';const box=el.firstChild,sen=el.lastChild;
  const more=()=>{box.insertAdjacentHTML('beforeend',txChunk(list,st.n,st.n+step,group,st.last));st.n+=step;if(st.n>=list.length){sen.remove();io&&io.disconnect()}};more();
  if(st.n<list.length&&'IntersectionObserver' in window){io=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting))more()},{rootMargin:'600px'});io.observe(sen)}else if(st.n<list.length){sen.innerHTML='<button class="btn sec block" type="button">Тағы</button>';sen.onclick=more}}

let STACK=[],ENTER=false;
const gattr=p=>`data-go="${esc(JSON.stringify(p))}"`;
function go(p){if(STACK.length)STACK[STACK.length-1].y=window.scrollY;STACK.push(p);ENTER=true;location.hash='d'+STACK.length}
function back(){if(history.length>1)history.back();else{STACK=[];location.hash='#'+view}}
function route(){closeSheet();const h=location.hash.slice(1);const m=/^d(\d+)$/.exec(h);
  if(m){const n=+m[1];if(STACK.length<n){location.replace('#'+(view||'home'));return}STACK.length=n;const ent=ENTER;render();window.scrollTo(0,ent?0:(STACK[n-1].y||0));return}
  STACK=[];if(h==='tx-pending'){TXF.pend=true;history.replaceState(null,'','#tx');view='tx';render();return}view=VIEWS.some(v=>v[0]===h)||h==='more'?h:'home';render();window.scrollTo(0,0)}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){e.preventDefault();const p=JSON.parse(g.dataset.go);if(g.closest('#sheet'))closeSheet();go(p);return}
  const b=e.target.closest('[data-tx]');if(b){if(b.closest('#sheet'))closeSheet();go({t:'tx',id:b.dataset.tx});return}
  if(e.target.closest('[data-back]'))back()});
/* charts that click through */
function hbars(obj,total,mk){const e=Object.entries(obj).filter(([,v])=>Math.abs(v)>0.5).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]));const max=Math.max(...e.map(x=>Math.abs(x[1])),1);
  if(!e.length)return '<div class="empty">Бұл кезеңде дерек жоқ</div>';
  return `<div class="hbars">${e.map(([k,v])=>{const [,c]=cmeta(k);const p=mk?mk(k):null;return `<${p?'button':'div'} class="hbar" ${p?'type="button" '+gattr(p):''}>${av(k,'s')}<div class="hb-mid"><div class="hb-top"><span>${esc(k)}</span><b class="num">${fmt(Math.abs(v),false)}</b></div><div class="track"><div class="fill" style="width:${Math.abs(v)/max*100}%;background:${c}"></div></div></div><small class="num">${total?Math.round(Math.abs(v)/total*100):0}%</small></${p?'button':'div'}>`}).join('')}</div>`}
function bars(list,valFn,labelFn,goFn,color){const vals=list.map(valFn);const max=Math.max(1,...vals.map(Math.abs));
  return `<div class="vbars">${list.map((x,i)=>`<button class="vb" type="button" ${goFn?gattr(goFn(x)):''}><span class="vb-v num">${fmtc(Math.abs(vals[i]))}</span><span class="vb-bar"><i style="height:${Math.max(3,Math.abs(vals[i])/max*100)}%;background:${color||'var(--accent)'}"></i></span><span class="vb-l">${labelFn(x)}</span></button>`).join('')}</div>`}
function monthChart(){const ms=[...new Set(TX.map(t=>t.d.slice(0,7)))].sort();const data=ms.map(m=>{const r=TX.filter(t=>t.d.startsWith(m)&&t.c!=='Өз шоттары арасында');return{m,inc:sum(r.filter(t=>!isExp(t))),exp:-sum(r.filter(t=>isExp(t))),sal:sum(r.filter(t=>t.c==='Ресми кіріс'))}});
  const max=Math.max(1,...data.map(d=>Math.max(d.inc,d.exp)));
  return `<div class="mchart">${data.map(d=>`<button class="mc" type="button" ${gattr({t:'month',m:d.m})}><div class="mc-bars"><i class="in" style="height:${d.inc/max*100}%"><i class="sal" style="height:${d.inc?d.sal/d.inc*100:0}%"></i></i><i class="out" style="height:${d.exp/max*100}%"></i></div><b>${MONTHN[+d.m.slice(5,7)-1].slice(0,3)}</b><small class="num">${fmtc(d.inc-d.exp)}</small></button>`).join('')}</div>
  <div class="chips legend"><span><i class="dot" style="background:var(--accent)"></i>Түсім</span><span><i class="dot" style="background:var(--pos)"></i>оның ішінде жалақы</span><span><i class="dot" style="background:var(--ink-3)"></i>Шығыс</span><span class="muted">Айды басыңыз</span></div>`}

  if(inPage){renderPage($('#v-page'));return}
  const meta=VIEWS.find(v=>v[0]===view)||['more','Тағы','Қосымша бөлімдер'];$('#title').textContent=meta[1];$('#subtitle').textContent=meta[2];
  $('#topAct').innerHTML=view==='home'||view==='tx'?`<button class="btn sec sm hide-m" type="button" id="upTop">${ico('upload')}Үзінді жүктеу</button>`:'';const ut=$('#upTop');if(ut)ut.onclick=()=>{location.hash='#upload'};
  const el=$('#v-'+view);
  if(view==='home')el.innerHTML=vHome();
  if(view==='tx'){el.innerHTML=vTx();bindTx()}
  if(view==='claims'){el.innerHTML=vClaims();bindClaims(el)}
  if(view==='funds'){el.innerHTML=vFunds();bindFunds(el)}
  if(view==='bills'){el.innerHTML=vBills();bindBills(el)}
  if(view==='cash'){el.innerHTML=vCash();bindCash(el)}
  if(view==='stats'){el.innerHTML=vStats();bindStats(el)}
  if(view==='upload'){el.innerHTML=vUpload();bindUpload(el)}
  if(view==='more'){el.innerHTML=vMore();const t=$('#theme2');if(t)t.onclick=toggleTheme}
  const sugN=suggestions().length;$$('[data-badge="claims"]').forEach(x=>x.innerHTML=sugN?`<span class="pill p-acc">${sugN}</span>`:'');
}

const money=memo(moneyRaw);const suggestions=memo(suggestionsRaw);

/* ================= misc ================= */
function toggleTheme(){const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';try{localStorage.setItem('qalta-theme',r.dataset.theme)}catch(e){}}
$('#themeBtn').onclick=toggleTheme;
try{const th=localStorage.getItem('qalta-theme');if(th)document.documentElement.dataset.theme=th}catch(e){}

/* ================= boot ================= */
const local=lsGet();
if(local&&local.book&&local.banks){S.banks=local.banks;S.book=local.book;S.source='local'}else{const s=seedState();S.banks=s.banks;S.book=s.book}
if(!S.book.aliases)S.book.aliases={'ХУДАЙБЕРГЕН Х':'ИЛХАМ Х'};
const hn=S.banks.H&&S.banks.H.meta&&S.banks.H.meta.name;if(hn)$('#whoami').textContent=hn.split(' ').map(w=>w[0]+w.slice(1).toLowerCase()).join(' ');
rebuild();navBuild();route();setSync('local','Жүктелуде…');
dbInit();
})();
